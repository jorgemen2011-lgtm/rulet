# Entorno local "como en producción": PostgreSQL + migraciones + API + web con las imágenes de producción.
#
#   docker compose up --build        # API en http://localhost:3000, web en http://localhost:3001
#   docker compose down              # para; añade -v para borrar también los datos de la BD
#
# ⚠️ SOLO PARA DESARROLLO LOCAL. Las credenciales y el secreto JWT de este archivo son públicos (están en
# git) y no deben usarse en ningún entorno desplegado. En producción se inyectan desde el gestor de
# secretos de la plataforma y la conexión a la BD va con TLS (DATABASE_SSL=true).

x-api-image: &api-image
  build: { context: ., dockerfile: apps/api/Dockerfile }
  image: rulet-api:local

# Endurecimiento común de los contenedores de la app (no del de la BD, que necesita escribir y cambiar de usuario).
x-hardening: &hardening
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]

x-database-env: &database-env
  DATABASE_URL: postgres://rulet:rulet_local_only@db:5432/rulet
  # Tráfico dentro de la red privada de compose y sin certificados: TLS desactivado de forma EXPLÍCITA
  # (la API exige este escape para aceptar DATABASE_SSL=false con NODE_ENV=production).
  DATABASE_SSL: 'false'
  DATABASE_SSL_ALLOW_INSECURE: 'true'

services:
  db:
    image: postgres:17-alpine
    environment:
      # Credenciales SOLO de desarrollo local.
      POSTGRES_USER: rulet
      POSTGRES_PASSWORD: rulet_local_only
      POSTGRES_DB: rulet
    volumes: ['db-data:/var/lib/postgresql/data']
    # Publicado solo en el loopback: no accesible desde otras máquinas de la red.
    ports: ['127.0.0.1:5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rulet -d rulet']
      interval: 5s
      timeout: 5s
      retries: 10

  # Paso one-shot: aplica las migraciones y termina. La API no arranca hasta que acaba bien.
  migrate:
    <<: [*api-image, *hardening]
    command: ['node', 'dist/database/migrate.js']
    environment:
      NODE_ENV: production
      <<: *database-env
    read_only: true
    restart: 'no'
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: [*api-image, *hardening]
    environment:
      NODE_ENV: production
      PORT: 3000
      <<: *database-env
      # Secreto SOLO de desarrollo local (≥ 32 caracteres). En producción: aleatorio y desde el gestor de secretos.
      JWT_ACCESS_SECRET: local-dev-only-insecure-jwt-secret-change-me-0123456789
      CORS_ORIGINS: http://localhost:3001
      # HTTP local: las cookies `Secure`/`__Host-` no se enviarían sin HTTPS.
      COOKIE_SECURE: 'false'
    read_only: true
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    <<: *hardening
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { NEXT_PUBLIC_API_URL: http://localhost:3000 }
    ports: ['127.0.0.1:3001:3001']
    depends_on: [api]

volumes:
  db-data:
