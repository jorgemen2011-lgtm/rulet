# Análisis de seguridad: código (CodeQL), dependencias nuevas en PRs, secretos en el historial y
# vulnerabilidades conocidas en las dependencias de producción. Cada job declara solo los permisos que usa.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Semanal (lunes 04:23 UTC): detecta vulnerabilidades publicadas después del último cambio.
    - cron: '23 4 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Ningún permiso por defecto: cada job pide los suyos.
permissions: {}

env:
  HUSKY: '0'

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # publicar los resultados en la pestaña Security
      actions: read # leer metadatos del workflow (necesario en repos privados)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          # JS/TS no necesita compilar para analizarse.
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: Revisión de dependencias
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  secrets:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # listar los commits del PR a escanear
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historial completo: un secreto borrado en un commit posterior sigue expuesto en git.
          fetch-depth: 0
          persist-credentials: false
      # En PR y push escanea los commits nuevos; en la ejecución semanal y manual, todo el historial.
      # Repo de cuenta personal: no necesita GITLEAKS_LICENSE.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sin comentarios en el PR: requeriría `pull-requests: write`. El resultado queda en el job.
          GITLEAKS_ENABLE_COMMENTS: 'false'

  audit:
    name: Auditoría de dependencias (pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Se audita el lockfile: no hace falta instalar. Solo dependencias de producción, severidad alta o mayor.
      - run: pnpm audit --prod --audit-level=high
