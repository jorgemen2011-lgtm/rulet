# Integración continua: calidad del código, tests contra PostgreSQL real y build + escaneo de las imágenes.
# Las actions se fijan a un SHA completo (inmutable); el comentario indica la versión y Dependabot las actualiza.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos por defecto para todos los jobs (el GITHUB_TOKEN solo puede leer el repo).
permissions:
  contents: read

env:
  # En CI no se instalan hooks de git (los ejecuta cada desarrollador en local).
  HUSKY: '0'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgres://rulet:rulet_ci@localhost:5432/rulet_test
      # BD que usan los e2e (apps/api/test/test-env.ts); debe terminar en `_test`.
      TEST_DATABASE_URL: postgres://rulet:rulet_ci@localhost:5432/rulet_test
      DATABASE_SSL: 'false'
      # Secreto ficticio solo para CI (≥ 32 caracteres). No protege nada real.
      JWT_ACCESS_SECRET: ci-only-not-a-secret-0123456789abcdefghijklmnopqrstuvwxyz
      JWT_ISSUER: rulet-api
      JWT_AUDIENCE: rulet-clients
      CORS_ORIGINS: http://localhost:3001
      COOKIE_SECURE: 'false'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Credenciales efímeras del contenedor de CI: no protegen nada real.
          POSTGRES_USER: rulet
          POSTGRES_PASSWORD: rulet_ci
          POSTGRES_DB: rulet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rulet -d rulet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm boundaries
      - run: pnpm turbo run lint typecheck test build

      # Los e2e de la API usan la BD real del servicio `postgres`. Las migraciones se aplican antes con
      # drizzle-kit, igual que en un despliegue. Se invocan con pnpm (no con turbo) para que el modo
      # estricto de variables de entorno de Turborepo no filtre las del job. NODE_ENV=test solo aquí.
      - name: Aplicar migraciones (BD de test)
        run: pnpm --filter @rulet/api db:migrate
        env:
          NODE_ENV: test
      - name: Tests e2e de la API
        run: pnpm --filter @rulet/api test:e2e
        env:
          NODE_ENV: test

  docker:
    name: Docker (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          # Se carga en el daemon local para que Trivy pueda escanearla.
          load: true
          tags: rulet-${{ matrix.app }}:ci
          build-args: NEXT_PUBLIC_API_URL=https://api.example.com
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Escaneo de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: rulet-${{ matrix.app }}:ci
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          # Solo bloquea lo que tiene parche disponible: lo demás no es accionable.
          ignore-unfixed: true
          exit-code: '1'
          format: table
