version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      nestjs: { patterns: ['@nestjs/*'] }
      expo: { patterns: ['expo', 'expo-*', 'react-native', 'react-native-*'] }
      next: { patterns: ['next', '@next/*'] }
      lint: { patterns: ['eslint', 'eslint-*', '@eslint/*', 'typescript-eslint', 'prettier'] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
